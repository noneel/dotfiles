---
- name: Rust | Install rustup
  ansible.builtin.apt:
    name: rustup
    state: present
    update_cache: true
  become: true

- name: Rust | Use stable toolchain
  ansible.builtin.command: rustup default stable
  register: rust_stable_toolchain
  changed_when: "'unchanged' not in rust_stable_toolchain.stdout"

