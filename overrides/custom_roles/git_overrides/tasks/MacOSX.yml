---
- name: "Git overrides | MacOSX | Install difftastic"
  community.general.homebrew:
    name: difftastic
    state: present

- name: "Git overrides | Set difftastic aliases"
  block:
    - name: "Git overrides | Set dlog alias"
      community.general.git_config:
        name: alias.dlog
        scope: global
        value: "-c diff.external=difft log --ext-diff"

    - name: "Git overrides | Set dshow alias"
      community.general.git_config:
        name: alias.dshow
        scope: global
        value: "-c diff.external=difft show --ext-diff"

    - name: "Git overrides | Set ddiff alias"
      community.general.git_config:
        name: alias.ddiff
        scope: global
        value: "-c diff.external=difft diff"

- name: "Git overrides | Set delta config"
  block:
    - name: "Git overrides | Set core.pager"
      community.general.git_config:
        name: core.pager
        scope: global
        value: delta

    - name: "Git overrides | Set delta interactive.diffFilter"
      community.general.git_config:
        name: delta.interactive.diffFilter
        scope: global
        value: "delta --color-only --features=interactive"

    - name: "Git overrides | Set delta.negative"
      community.general.git_config:
        name: delta.negative
        scope: global
        value: true

    - name: "Git overrides | Set delta.side-by-side"
      community.general.git_config:
        name: delta.side-by-side
        scope: global
        value: true

    - name: "Git overrides | Set merge.conflictStyle"
      community.general.git_config:
        name: merge.conflictStyle
        scope: global
        value: zdiff3
